services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=reports;encrypt=true;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD:-P@ssw0rd12345}
      JPA_DDL_AUTO: update
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    ports:
      - "1500:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-P@ssw0rd12345}
      MSSQL_PID: Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

  sqlserver-init:
    image: mcr.microsoft.com/mssql-tools
    platform: linux/amd64
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-P@ssw0rd12345}
    depends_on:
      - sqlserver
    command: >
      /bin/bash -c "
      SQLCMD=/opt/mssql-tools/bin/sqlcmd;
      SQLCMD_EXTRA_ARGS=;
      if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
        SQLCMD_EXTRA_ARGS=-C;
      fi;
      until $${SQLCMD} -S sqlserver -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b $${SQLCMD_EXTRA_ARGS}; do
        sleep 2;
      done;
      $${SQLCMD} -S sqlserver -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"IF DB_ID('reports') IS NULL CREATE DATABASE reports\" -b $${SQLCMD_EXTRA_ARGS}
      "

  seed-data:
    image: mcr.microsoft.com/mssql-tools
    platform: linux/amd64
    profiles:
      - seed
    environment:
      DB_HOST: sqlserver
      DB_NAME: reports
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD:-P@ssw0rd12345}
    depends_on:
      - app
    volumes:
      - ./scripts/sqlserver:/scripts:ro
    command: /bin/bash /scripts/run-seed.sh

volumes:
  sqlserver-data:
